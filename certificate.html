<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Certificate | SK Sapilang</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;font-family:Arial,sans-serif;color:#16324a}.toolbar{max-width:1120px;margin:18px auto;display:flex;gap:10px;justify-content:flex-end;padding:0 14px}.toolbar a,.toolbar button{border:0;border-radius:10px;padding:11px 16px;background:#16324a;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.toolbar .light{background:#fff;color:#16324a;border:1px solid #ccd5db}.status{max-width:900px;margin:50px auto;padding:25px;background:#fff;border-radius:16px;text-align:center}.certificate{position:relative;width:1120px;aspect-ratio:297/210;margin:0 auto 30px;background:#fff center/100% 100% no-repeat;box-shadow:0 10px 35px #0002;overflow:hidden}.layer{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.layer img{max-width:100%;max-height:100%;object-fit:contain}.qr{background:#fff;padding:3px}.qr img,.qr canvas{width:100%!important;height:100%!important}.invalid{color:#a52828}.blank-note{max-width:1120px;margin:0 auto 12px;padding:12px 16px;background:#fff7dd;border:1px solid #e4c768;border-radius:10px}@media(max-width:1150px){.certificate{width:96%}}@media print{@page{size:A4 landscape;margin:0}body{background:#fff}.toolbar,.blank-note{display:none!important}.certificate{width:297mm;height:210mm;margin:0;box-shadow:none}}
</style><link rel="stylesheet" href="global-readability.css">
</head><body><div class="toolbar"><a class="light" href="feedback.html">Back to QMS</a><a class="light" id="verifyLink" href="certificate-verify.html">Verify</a><button onclick="window.print()">Print / Save PDF</button></div><div id="blankNote" class="blank-note" hidden><strong>Certificate Preview:</strong> This preview uses the saved activity design and editable system layers.</div><div id="loading" class="status"><h2>Loading certificate…</h2></div><main id="certificate" class="certificate" hidden><div id="name" class="layer"></div><div id="certNo" class="layer"></div><div id="qr" class="layer qr"></div></main><script src="cms-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('id')||'',blank=qs.get('blank')==='1',endpoint=window.SK_CMS_ENDPOINT||'',loading=document.getElementById('loading');let settings={},tpl={};
function jsonp(params){return new Promise((resolve,reject)=>{if(!endpoint)return reject(new Error('CMS endpoint not configured'));const cb='c'+Date.now()+Math.floor(Math.random()*9999),sc=document.createElement('script');window[cb]=r=>{delete window[cb];sc.remove();resolve(r)};sc.onerror=()=>reject(new Error('Unable to connect'));sc.src=endpoint+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(sc)})}
const defaults={name:{x:50,y:46,w:62,h:9,fontSize:34,fontFamily:'Georgia',color:'#08284a',align:'center',bold:true},qr:{x:84,y:82,w:11,h:16},no:{x:18,y:92,w:28,h:5,fontSize:12,fontFamily:'Arial',color:'#08284a',align:'left',bold:true}};
function apply(el,v){if(!el||!v)return;el.style.left=v.x+'%';el.style.top=v.y+'%';el.style.width=v.w+'%';el.style.height=v.h+'%';if(v.fontSize)el.style.fontSize=v.fontSize+'px';el.style.fontFamily=v.fontFamily||'Arial';el.style.color=v.color||'#08284a';el.style.textAlign=v.align||'center';el.style.justifyContent=v.align==='left'?'flex-start':v.align==='right'?'flex-end':'center';el.style.fontWeight=v.bold?'700':'400';el.style.fontStyle=v.italic?'italic':'normal';el.style.letterSpacing=(v.letterSpacing||0)+'px';el.style.lineHeight=v.lineHeight||1.2;el.style.opacity=(v.opacity??100)/100;el.style.transform=`translate(-50%,-50%) rotate(${v.rotate||0}deg)`;el.style.zIndex=v.z||2;el.style.display=v.hidden?'none':'';el.style.whiteSpace=v.wrap===false?'nowrap':'pre-wrap';el.style.wordBreak='normal';el.style.overflowWrap='normal'}
function render(c){const cert=document.getElementById('certificate');const saved=tpl.layout||{},layout={};['name','qr','no'].forEach(k=>layout[k]={...defaults[k],...(saved[k]||{})}); if(!tpl.layout){ layout.name={...layout.name,x:Number(settings.nameX)||50,y:Number(settings.nameY)||49,fontSize:Number(settings.nameSize)||44}; layout.qr={...layout.qr,x:Number(settings.qrX)||83,y:Number(settings.qrY)||78,w:(Number(settings.qrSize)||96)/11.2,h:(Number(settings.qrSize)||96)/7.9}; layout.no={...layout.no,x:Number(settings.noX)||7,y:Number(settings.noY)||91,fontSize:Number(settings.noSize)||14}; }Object.entries(layout).forEach(([k,v])=>apply(document.getElementById(k==='no'?'certNo':k),v));const bg=tpl.background||settings.certificateBackground||'';if(bg)cert.style.backgroundImage=`url("${bg.replaceAll('"','%22')}")`;document.getElementById('name').textContent=blank?'SAMPLE PARTICIPANT NAME':(c.participant||'');document.getElementById('certNo').textContent=blank?'Certificate No. SK-SAP-2026-000001':'Certificate No. '+c.certificateId;if(blank){document.getElementById('blankNote').hidden=false;document.getElementById('qr').innerHTML='<strong style="font-size:11px">UNIQUE QR</strong>'}else{const verify=new URL('certificate-verify.html',location.href);verify.searchParams.set('id',c.certificateId);document.getElementById('verifyLink').href=verify.href;new QRCode(document.getElementById('qr'),{text:verify.href,width:140,height:140})}loading.remove();cert.hidden=false}
(async()=>{try{const sr=await jsonp({action:'certificate-settings'});settings=sr.settings||{};let c={certificateType:'Participation'};if(!blank){if(!id)throw new Error('A certificate number is required.');const r=await jsonp({action:'verify-certificate',id});if(!r.success||!r.found||r.certificate.status==='REVOKED')throw new Error('This certificate could not be verified.');c=r.certificate;if(c.templateId){const tr=await jsonp({action:'public',page:'certificate-templates'}),t=(tr.items||[]).find(x=>x.id===c.templateId);if(t){try{tpl=JSON.parse(t.description||'{}')}catch{}tpl.background=t.mediaUrl||''}}}render(c)}catch(e){loading.innerHTML='<h2 class="invalid">Certificate unavailable</h2><p>'+e.message+'</p>'}})();
</script></body></html>
