<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Certificate | SK Sapilang</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;font-family:Arial,sans-serif;color:#16324a}.toolbar{max-width:1120px;margin:18px auto;display:flex;gap:10px;justify-content:flex-end;padding:0 14px}.toolbar a,.toolbar button{border:0;border-radius:10px;padding:11px 16px;background:#16324a;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.toolbar .light{background:#fff;color:#16324a;border:1px solid #ccd5db}.status{max-width:900px;margin:50px auto;padding:25px;background:#fff;border-radius:16px;text-align:center}.certificate{position:relative;width:1120px;aspect-ratio:297/210;margin:0 auto 30px;background:#fff center/100% 100% no-repeat;box-shadow:0 10px 35px #0002;overflow:hidden}.layer{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.layer img{max-width:100%;max-height:100%;object-fit:contain}.qr{background:#fff;padding:3px}.qr img,.qr canvas{width:100%!important;height:100%!important}.invalid{color:#a52828}.blank-note{max-width:1120px;margin:0 auto 12px;padding:12px 16px;background:#fff7dd;border:1px solid #e4c768;border-radius:10px}@media(max-width:1150px){.certificate{width:96%}}@media print{@page{size:A4 landscape;margin:0}body{background:#fff}.toolbar,.blank-note{display:none!important}.certificate{width:297mm;height:210mm;margin:0;box-shadow:none}}
</style></head><body><div class="toolbar"><a class="light" href="feedback.html">Back to QMS</a><a class="light" id="verifyLink" href="certificate-verify.html">Verify</a><button onclick="window.print()">Print / Save PDF</button></div><div id="blankNote" class="blank-note" hidden><strong>Certificate Preview:</strong> This preview uses the saved activity design and editable system layers.</div><div id="loading" class="status"><h2>Loading certificate…</h2></div><main id="certificate" class="certificate" hidden><div id="header" class="layer"></div><div id="logo1" class="layer"><img></div><div id="logo2" class="layer"><img></div><div id="heading" class="layer"></div><div id="name" class="layer"></div><div id="citation" class="layer"></div><div id="signature" class="layer"><div><img id="sigImg" style="display:none;margin:auto"><strong id="sigName"></strong><br><span id="sigPos"></span></div></div><div id="certNo" class="layer"></div><div id="qr" class="layer qr"></div></main><script src="cms-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('id')||'',blank=qs.get('blank')==='1',endpoint=window.SK_CMS_ENDPOINT||'',loading=document.getElementById('loading');let settings={},tpl={};
function jsonp(params){return new Promise((resolve,reject)=>{if(!endpoint)return reject(new Error('CMS endpoint not configured'));const cb='c'+Date.now()+Math.floor(Math.random()*9999),sc=document.createElement('script');window[cb]=r=>{delete window[cb];sc.remove();resolve(r)};sc.onerror=()=>reject(new Error('Unable to connect'));sc.src=endpoint+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(sc)})}
const defaults={header:{x:50,y:10,w:58,h:5,fontSize:15},logo1:{x:15,y:13,w:9,h:13},logo2:{x:85,y:13,w:9,h:13},heading:{x:50,y:30,w:60,h:8,fontSize:30},name:{x:50,y:46,w:62,h:9,fontSize:34},citation:{x:50,y:59,w:66,h:18,fontSize:13},signature:{x:50,y:79,w:28,h:12,fontSize:12},qr:{x:84,y:82,w:11,h:16},no:{x:18,y:92,w:28,h:5,fontSize:12}};
function apply(el,v){if(!el||!v)return;el.style.left=v.x+'%';el.style.top=v.y+'%';el.style.width=v.w+'%';el.style.height=v.h+'%';if(v.fontSize)el.style.fontSize=v.fontSize+'px'}
function render(c){const cert=document.getElementById('certificate'),layout={...defaults,...(tpl.layout||{})};Object.entries(layout).forEach(([k,v])=>apply(document.getElementById(k==='no'?'certNo':k),v));const bg=tpl.background||settings.certificateBackground||'';if(bg)cert.style.backgroundImage=`url("${bg.replaceAll('"','%22')}")`;document.getElementById('header').textContent=tpl.headerText||'SANGGUNIANG KABATAAN OF BARANGAY SAPILANG';document.querySelector('#logo1 img').src=tpl.logo1||settings.logo1||'images/sk-logo.svg';document.querySelector('#logo2 img').src=tpl.logo2||settings.logo2||'images/barangay-logo.svg';document.getElementById('heading').textContent=tpl.heading||('Certificate of '+(c.certificateType||'Participation'));document.getElementById('name').textContent=blank?'SAMPLE PARTICIPANT NAME':(c.participant||'');document.getElementById('citation').textContent=blank?(tpl.citation||'Certificate citation / content appears here.'):(c.citation||tpl.citation||'');document.getElementById('certNo').textContent=blank?'Certificate No. SK-SAP-2026-000001':'Certificate No. '+c.certificateId;document.getElementById('sigName').textContent=tpl.signatory||settings.signatory1||'DANDY F. NILLO';document.getElementById('sigPos').textContent=tpl.signatoryPosition||settings.position1||'SK Chairperson';const su=tpl.signatureUrl||'';if(su){const im=document.getElementById('sigImg');im.src=su;im.style.display='block'}if(blank){document.getElementById('blankNote').hidden=false;document.getElementById('qr').innerHTML='<strong style="font-size:11px">UNIQUE QR</strong>'}else{const verify=new URL('certificate-verify.html',location.href);verify.searchParams.set('id',c.certificateId);document.getElementById('verifyLink').href=verify.href;new QRCode(document.getElementById('qr'),{text:verify.href,width:140,height:140})}loading.remove();cert.hidden=false}
(async()=>{try{const sr=await jsonp({action:'certificate-settings'});settings=sr.settings||{};let c={certificateType:'Participation'};if(!blank){if(!id)throw new Error('A certificate number is required.');const r=await jsonp({action:'verify-certificate',id});if(!r.success||!r.found||r.certificate.status==='REVOKED')throw new Error('This certificate could not be verified.');c=r.certificate;if(c.templateId){const tr=await jsonp({action:'public',page:'certificate-templates'}),t=(tr.items||[]).find(x=>x.id===c.templateId);if(t){try{tpl=JSON.parse(t.description||'{}')}catch{}tpl.background=t.mediaUrl||''}}}render(c)}catch(e){loading.innerHTML='<h2 class="invalid">Certificate unavailable</h2><p>'+e.message+'</p>'}})();
</script></body></html>
