<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Certificate | SK Sapilang</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f4;font-family:Arial,sans-serif;color:#16324a}.toolbar{max-width:1120px;margin:18px auto;display:flex;gap:10px;justify-content:flex-end;padding:0 14px}.toolbar a,.toolbar button{border:0;border-radius:10px;padding:11px 16px;background:#16324a;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.toolbar .light{background:#fff;color:#16324a;border:1px solid #ccd5db}.status{max-width:900px;margin:50px auto;padding:25px;background:#fff;border-radius:16px;text-align:center}.certificate{position:relative;width:1120px;aspect-ratio:297/210;margin:0 auto 30px;background:#fff center/100% 100% no-repeat;box-shadow:0 10px 35px #0002;overflow:hidden}.fallback{position:absolute;inset:0;border:18px solid #16324a;outline:3px solid #e97924;outline-offset:-30px;display:grid;place-items:center;text-align:center;padding:80px}.fallback h1{font:700 52px Georgia,serif;color:#e97924;margin:0}.overlay{position:absolute;inset:0}.participant{position:absolute;left:14%;right:14%;top:45%;text-align:center;font:700 42px Georgia,serif;color:#142b3b;text-transform:uppercase}.certno{position:absolute;left:7%;bottom:5.5%;font-size:13px;font-weight:700;color:#142b3b}.qr{position:absolute;right:6.2%;bottom:4.5%;width:105px;height:105px;background:#fff;padding:4px}.qr img,.qr canvas{width:100%!important;height:100%!important}.hint{position:absolute;left:15%;right:15%;top:56%;text-align:center;font-size:14px;color:#52636f}.invalid{color:#a52828}.blank-note{max-width:1120px;margin:0 auto 12px;padding:12px 16px;background:#fff7dd;border:1px solid #e4c768;border-radius:10px}
@media(max-width:1150px){.certificate{width:96%}.participant{font-size:3.6vw}.qr{transform:scale(.8);transform-origin:right bottom}}@media print{@page{size:A4 landscape;margin:0}body{background:#fff}.toolbar,.blank-note{display:none!important}.certificate{width:297mm;height:210mm;margin:0;box-shadow:none}.qr img,.qr canvas{width:100%!important;height:100%!important}}
</style></head><body>
<div class="toolbar"><a class="light" href="feedback.html">Back to QMS</a><a class="light" id="verifyLink" href="certificate-verify.html">Verify</a><button onclick="window.print()">Print / Save PDF</button></div>
<div id="blankNote" class="blank-note" hidden><strong>Master Certificate Preview:</strong> Replace the background from QMS Admin after editing your master design in Canva.</div>
<div id="loading" class="status"><h2>Loading certificate…</h2></div>
<main id="certificate" class="certificate" hidden><div id="fallback" class="fallback"><div><div>SANGGUNIANG KABATAAN OF BARANGAY SAPILANG</div><h1>Certificate of Participation</h1><p>Upload your Canva master certificate background in QMS Admin.</p></div></div><div class="overlay"><div id="certHeading" style="position:absolute;left:10%;right:10%;top:30%;text-align:center;font:700 34px Georgia,serif"></div><div id="certName" class="participant"></div><div id="certNo" class="certno"></div><div id="qr" class="qr"></div><div id="hint" class="hint"></div></div></main>
<script src="cms-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('id')||'',blank=qs.get('blank')==='1',endpoint=window.SK_CMS_ENDPOINT||'',loading=document.getElementById('loading');let settings={};
function jsonp(params){return new Promise((resolve,reject)=>{if(!endpoint)return reject(new Error('CMS endpoint not configured'));const cb='c'+Date.now()+Math.floor(Math.random()*9999),sc=document.createElement('script');window[cb]=r=>{delete window[cb];sc.remove();resolve(r)};sc.onerror=()=>reject(new Error('Unable to connect'));sc.src=endpoint+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(sc)})}
function render(c){const cert=document.getElementById('certificate'),bg=settings.certificateBackground||'',name=document.getElementById('certName'),qr=document.getElementById('qr'),no=document.getElementById('certNo');name.style.left=(settings.nameX||50)+'%';name.style.right='auto';name.style.transform='translate(-50%,-50%)';name.style.top=(settings.nameY||49)+'%';name.style.fontSize=(settings.nameSize||44)+'px';qr.style.left=(settings.qrX||83)+'%';qr.style.top=(settings.qrY||78)+'%';qr.style.width=(settings.qrSize||96)+'px';qr.style.height=(settings.qrSize||96)+'px';qr.style.right='auto';qr.style.bottom='auto';qr.style.transform='translate(-50%,-50%)';no.style.left=(settings.noX||7)+'%';no.style.top=(settings.noY||91)+'%';no.style.fontSize=(settings.noSize||14)+'px';no.style.bottom='auto';if(bg){cert.style.backgroundImage=`url("${bg.replaceAll('"','%22')}")`;document.getElementById('fallback').style.display='none'}document.getElementById('certName').textContent=blank?'SAMPLE PARTICIPANT':(c.participant||'');document.getElementById('certNo').textContent=blank?'SAMPLE CERTIFICATE NO.':('Certificate No. '+c.certificateId);if(blank)document.getElementById('hint').textContent='Name, certificate number and QR are generated automatically by the system.';if(!blank){const verify=new URL('certificate-verify.html',location.href);verify.searchParams.set('id',c.certificateId);document.getElementById('verifyLink').href=verify.href;new QRCode(document.getElementById('qr'),{text:verify.href,width:97,height:97})}else{document.getElementById('blankNote').hidden=false;document.getElementById('qr').innerHTML='<div style="font-size:11px;text-align:center;padding-top:30px">UNIQUE QR</div>'}loading.remove();cert.hidden=false}
(async()=>{try{const sr=await jsonp({action:'certificate-settings'});settings=sr.settings||{};if(blank)return render({});if(!id)throw new Error('A certificate number is required.');const r=await jsonp({action:'verify-certificate',id});if(!r.success||!r.found||r.certificate.status==='REVOKED')throw new Error('This certificate could not be verified.');if(r.certificate.templateId){try{const tr=await jsonp({action:'public',page:'certificate-templates'}),t=(tr.items||[]).find(x=>x.id===r.certificate.templateId);if(t){let d={};try{d=JSON.parse(t.description||'{}')}catch{};settings.certificateBackground=t.mediaUrl||settings.certificateBackground;document.getElementById('certHeading').textContent=d.heading||('Certificate of '+(r.certificate.certificateType||'Recognition'));document.getElementById('hint').textContent=r.certificate.citation||d.citation||''}}catch(_){}}render(r.certificate);if(!document.getElementById('certHeading').textContent)document.getElementById('certHeading').textContent='Certificate of '+(r.certificate.certificateType||'Participation');if(r.certificate.citation)document.getElementById('hint').textContent=r.certificate.citation}catch(e){loading.innerHTML='<h2 class="invalid">Certificate unavailable</h2><p>'+e.message+'</p>'}})();
</script></body></html>
