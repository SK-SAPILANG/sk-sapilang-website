<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KK Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="container"><div class="center"><h1>KK Verification Dashboard</h1><p class="muted">Barangay Sapilang • Bacnotan, La Union</p></div>
<div id="login" class="panel card"><h2>Administrator Login</h2><div class="row"><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Sign In</button></div><div id="loginMsg"></div></div>
<div id="dash" class="hidden"><div id="msg"></div><div class="panel"><div class="row"><input id="search" placeholder="Search name or KK ID" oninput="render()"><select id="filter" onchange="render()"><option value="">All status</option><option>PENDING</option><option>VERIFIED</option><option>REJECTED</option></select><button class="secondary" onclick="load()">Refresh</button><button class="danger" onclick="logout()">Logout</button></div><div class="table-wrap"><table><thead><tr><th>KK ID</th><th>Name</th><th>Purok</th><th>Status</th><th>ID</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<script src="config.js"></script><script>
let password="",data=[];
async function api(obj){const p=new URLSearchParams();Object.entries(obj).forEach(([k,v])=>p.append(k,v));const r=await fetch(KK_CONFIG.API_URL,{method:"POST",body:p});return r.json()}
function note(id,t,ok=false){document.getElementById(id).innerHTML=`<div class="message ${ok?"ok":"error"}">${esc(t)}</div>`}
async function login(){password=document.getElementById("pw").value.trim();if(!password)return note("loginMsg","Enter the admin password.");try{let r=await api({action:"adminList",password});if(!r.success)throw Error(r.message);data=r.data||[];document.getElementById("login").classList.add("hidden");document.getElementById("dash").classList.remove("hidden");render()}catch(e){password="";note("loginMsg",e.message)}}
async function load(){try{let r=await api({action:"adminList",password});if(!r.success)throw Error(r.message);data=r.data||[];render()}catch(e){note("msg",e.message)}}
function render(){let q=(document.getElementById("search")?.value||"").toLowerCase(),f=document.getElementById("filter")?.value||"";let x=data.filter(p=>(`${p.KK_ID} ${p.FULL_NAME} ${p.EMAIL}`.toLowerCase().includes(q))&&(!f||p.VERIFICATION_STATUS===f));document.getElementById("rows").innerHTML=x.length?x.map(p=>`<tr><td>${esc(p.KK_ID)}</td><td>${esc(p.FULL_NAME)}</td><td>${esc(p.PUROK)}</td><td>${esc(p.VERIFICATION_STATUS)}</td><td>${esc(p.ID_STATUS)}</td><td>${buttons(p)}</td></tr>`).join(""):`<tr><td colspan="6">No records found.</td></tr>`}
function buttons(p){if(p.VERIFICATION_STATUS==="PENDING")return `<button class="success" onclick="act('verifyRegistrant','${js(p.KK_ID)}')">Verify</button> <button class="danger" onclick="act('rejectRegistrant','${js(p.KK_ID)}')">Reject</button>`;if(p.VERIFICATION_STATUS==="VERIFIED"&&p.ID_STATUS==="ACTIVE")return `<button class="primary" onclick="location.href='digital-id.html?id=${encodeURIComponent(p.KK_ID)}'">Digital ID</button> <button class="danger" onclick="act('revokeID','${js(p.KK_ID)}')">Revoke</button>`;if(p.VERIFICATION_STATUS==="VERIFIED"&&p.ID_STATUS==="REVOKED")return `<button class="success" onclick="act('restoreID','${js(p.KK_ID)}')">Restore</button>`;return ""}
async function act(action,id){if(!confirm(`Continue with ${id}?`))return;try{let r=await api({action,password,kkId:id});if(!r.success)throw Error(r.message);note("msg",r.message||"Done.",true);await load()}catch(e){note("msg",e.message)}}
function logout(){password="";data=[];document.getElementById("dash").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
</script></body></html>
