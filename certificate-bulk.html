<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK Sapilang Certificate Batch</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#08284a}button{padding:12px 16px;margin:6px;border:1px solid #08284a;border-radius:8px;background:white;font-weight:700}.primary{background:#ff9900}.card{padding:14px;border:1px solid #ddd;border-radius:10px;margin:8px 0}small{color:#567}</style></head><body><h1>Certificate Batch</h1><p id="summary"></p><div><button class="primary" id="openAll">Open All Certificates</button><button id="printGuide">Print Instructions</button></div><div id="list"></div><script>const mode=new URLSearchParams(location.search).get('mode')||'all';let items=[];try{items=JSON.parse(sessionStorage.getItem('skCertificateBatch')||'[]')}catch(e){};const label=mode==='hard'?'Hard Copy Print Batch':mode==='e'?'E-Certificate Batch':'All Certificates';document.getElementById('summary').textContent=label+' — '+items.length+' certificate(s).';document.getElementById('list').innerHTML=items.map((c,i)=>'<div class="card"><b>'+(i+1)+'. '+esc(c.participant||'Participant')+'</b><br><small>'+esc(c.activity||'')+' · '+esc(c.certificateId||'')+'</small> <a target="_blank" href="certificate.html?id='+encodeURIComponent(c.certificateId||'')+'">Open</a></div>').join('');function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}document.getElementById('openAll').onclick=()=>{items.forEach((c,i)=>setTimeout(()=>window.open('certificate.html?id='+encodeURIComponent(c.certificateId||''),'_blank'),i*250))};document.getElementById('printGuide').onclick=()=>alert(mode==='hard'?'Open All Certificates, then use Print / Save as PDF on each certificate. Your browser may ask you to allow pop-ups.':'Open the certificates to review or save them as PDF.');</script></body></html>
