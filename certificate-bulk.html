<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK Sapilang Certificate Bulk Manager</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6f9;color:#0b2948}.bar{position:sticky;top:0;z-index:5;background:#fff;padding:16px 22px;border-bottom:1px solid #ccd6df;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar button{padding:11px 16px;border:0;border-radius:8px;background:#0b2948;color:#fff;font-weight:700;cursor:pointer}.bar button.primary{background:#ef8b00}.status{padding:18px 22px}.stage{position:absolute;left:-100000px;top:0;width:1120px}.stage iframe{width:1120px;height:800px;border:0;display:block}</style>
</head><body><div class="bar"><strong>SK Sapilang Certificate Bulk Manager</strong><button class="primary" id="go">Generate Files</button><button onclick="window.close()">Close</button></div><div class="status" id="status">Loading certificate selection…</div><div class="stage" id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const records=JSON.parse(sessionStorage.getItem('skCertificateBulkRecords')||'[]'), mode=new URLSearchParams(location.search).get('mode')||'all', status=document.getElementById('status');
status.textContent=records.length?`${records.length} certificate(s) ready. Click Generate Files.`:'No certificate records were received. Return to QMS Admin and select an activity.';
function safe(s){return String(s||'certificate').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,100)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function canvasFor(rec){return new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.src='certificate.html?id='+encodeURIComponent(rec.certificateId);document.getElementById('stage').appendChild(f);f.onload=async()=>{try{for(let i=0;i<30;i++){const el=f.contentDocument&&f.contentDocument.getElementById('certificate');if(el&&!el.hidden){await wait(250);const c=await html2canvas(el,{scale:1.5,useCORS:true,backgroundColor:'#ffffff'});f.remove();resolve(c);return}await wait(250)}throw new Error('Certificate did not finish loading: '+rec.certificateId)}catch(e){f.remove();reject(e)}};f.onerror=()=>{f.remove();reject(new Error('Could not load '+rec.certificateId))}})}
async function pdfBlob(canvas){const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(canvas.toDataURL('image/jpeg',.96),'JPEG',0,0,297,210);return pdf.output('blob')}
async function generate(){if(!records.length)return;document.getElementById('go').disabled=true;try{if(mode==='hard'){const {jsPDF}=window.jspdf;let pdf=null;for(let i=0;i<records.length;i++){status.textContent=`Preparing hard-copy certificate ${i+1} of ${records.length}…`;const c=await canvasFor(records[i]);if(!pdf)pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});else pdf.addPage('a4','landscape');pdf.addImage(c.toDataURL('image/jpeg',.96),'JPEG',0,0,297,210)}const activity=safe(records[0]?.activity||'All-Activities');pdf.save(activity+'-Hard-Copy-Certificates.pdf');status.textContent='Combined hard-copy PDF created. It is ready for one-go printing.';}else{const zip=new JSZip();for(let i=0;i<records.length;i++){status.textContent=`Preparing certificate ${i+1} of ${records.length}…`;const c=await canvasFor(records[i]);const blob=await pdfBlob(c);zip.file(safe(records[i].participant)+' - '+safe(records[i].certificateId)+'.pdf',blob)}status.textContent='Creating ZIP…';const out=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=safe(records[0]?.activity||'All-Activities')+(mode==='email'?'-E-Certificates.zip':'-All-Certificates.zip');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);status.textContent='Certificate ZIP created successfully.'}}catch(e){status.textContent='Error: '+e.message;console.error(e)}finally{document.getElementById('go').disabled=false}}
document.getElementById('go').addEventListener('click',generate);
</script></body></html>
