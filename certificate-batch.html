<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Batch | SK Sapilang</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0a2540;padding:24px}.box{max-width:850px;margin:auto;background:#fff;padding:24px;border-radius:14px}.frames{position:fixed;left:-20000px;top:0;width:1123px}.frames iframe{width:1123px;height:794px;border:0}.btn{background:#ff7a00;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:700}#status{margin:14px 0;line-height:1.5}</style></head><body><div class="box"><h2>SK Sapilang Certificate Batch</h2><p id="status">Preparing certificates… Keep this tab open.</p><button class="btn" id="retry" style="display:none" onclick="location.reload()">Try Again</button></div><div class="frames" id="frames"></div>
<script>
(async()=>{const p=new URLSearchParams(location.search),mode=p.get('mode')||'pdf',ids=(p.get('ids')||'').split(',').map(x=>x.trim()).filter(Boolean),status=document.getElementById('status'),wrap=document.getElementById('frames');if(!ids.length){status.textContent='No certificates were selected.';return}try{const images=[];for(let i=0;i<ids.length;i++){status.textContent=`Rendering certificate ${i+1} of ${ids.length}…`;const f=document.createElement('iframe');f.src='certificate.html?id='+encodeURIComponent(ids[i]);wrap.appendChild(f);await new Promise((ok,fail)=>{f.onload=()=>setTimeout(ok,1200);setTimeout(()=>fail(new Error('Certificate loading timed out.')),15000)});const doc=f.contentDocument,el=doc&&doc.getElementById('certificateCanvas');if(!el)throw new Error('Could not render '+ids[i]);const c=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff'});images.push({id:ids[i],data:c.toDataURL('image/jpeg',.94)});f.remove()}const {jsPDF}=window.jspdf;if(mode==='zip'){status.textContent='Building E-Certificates ZIP…';const zip=new JSZip();for(const x of images){const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(x.data,'JPEG',0,0,297,210);zip.file(x.id+'.pdf',pdf.output('blob'))}const blob=await zip.generateAsync({type:'blob'});download(blob,'SK-Sapilang-E-Certificates.zip')}else{status.textContent='Building combined Hard Copy PDF…';const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});images.forEach((x,i)=>{if(i)pdf.addPage('a4','landscape');pdf.addImage(x.data,'JPEG',0,0,297,210)});pdf.save('SK-Sapilang-Hard-Copy-Certificates.pdf')}status.textContent=`Done. ${images.length} certificate(s) processed.`}catch(e){status.textContent='Batch generation could not finish: '+(e.message||e)+'. Please check your internet connection and try again.';document.getElementById('retry').style.display='inline-block'}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}})();
</script></body></html>
