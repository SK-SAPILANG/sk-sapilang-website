<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate | SK Sapilang</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f3f6f7}.wrap{max-width:760px;margin:60px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 12px 35px #0001}.row{padding:12px 0;border-bottom:1px solid #e7ecef}.row small{display:block;color:#687985}.row strong{font-size:18px}.valid{color:#18733b}.invalid{color:#a52828}.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;padding:12px;border:1px solid #ccd6dc;border-radius:10px}.search button{padding:12px 18px;border:0;border-radius:10px;background:#16324a;color:#fff;font-weight:700}</style><link rel="stylesheet" href="css/universal-device-2026.css?v=20260917">
</head><body><main class="wrap"><div class="card"><h1>SK Sapilang Certificate Verification</h1><p>Enter the certificate number or scan the QR code printed on a digital certificate.</p><div class="search"><input id="id" placeholder="e.g. SKSAP-2026-000001"><button id="go">Verify</button></div><div id="result"></div></div></main><script src="cms-config.js"></script><script>
const input=document.getElementById('id'),result=document.getElementById('result');input.value=new URLSearchParams(location.search).get('id')||'';function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function verify(){const id=input.value.trim(),ep=window.SK_CMS_ENDPOINT||'';if(!id){result.innerHTML='<p class="invalid">Enter a certificate number.</p>';return}result.innerHTML='<p>Checking certificate…</p>';const cb='verify'+Date.now();window[cb]=r=>{delete window[cb];s.remove();if(!r.success||!r.found||r.certificate.status==='REVOKED'){result.innerHTML='<h2 class="invalid">Not Verified</h2><p>No active SK Sapilang certificate matches this number.</p>';return}const c=r.certificate;result.innerHTML=`<h2 class="valid">✓ VALID CERTIFICATE</h2><div class="row"><small>Certificate Number</small><strong>${esc(c.certificateId)}</strong></div><div class="row"><small>Participant</small><strong>${esc(c.participant)}</strong></div><div class="row"><small>Activity / Program</small><strong>${esc(c.activity)}</strong></div><div class="row"><small>Date</small><strong>${esc(c.date||'—')}</strong></div><div class="row"><small>Venue</small><strong>${esc(c.venue||'—')}</strong></div><div class="row"><small>Issued By</small><strong>Sangguniang Kabataan of Barangay Sapilang</strong></div>`};const s=document.createElement('script');s.src=ep+'?action=verify-certificate&id='+encodeURIComponent(id)+'&callback='+cb+'&_='+Date.now();s.onerror=()=>result.innerHTML='<p class="invalid">Unable to reach the verification server.</p>';document.head.appendChild(s)}document.getElementById('go').onclick=verify;input.addEventListener('keydown',e=>{if(e.key==='Enter')verify()});if(input.value)verify();</script></body></html>
