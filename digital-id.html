<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital KK ID | Barangay Sapilang</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

:root {
  --red: #c8102e;
  --dark-red: #9f1028;
  --orange: #f47c20;
  --gold: #f5a800;
  --green: #138a4b;
  --dark: #171717;
  --gray: #666666;
  --light: #f7f7f7;
  --white: #ffffff;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px;
  font-family: Arial, Helvetica, sans-serif;
  background: #eeeeee;
  color: var(--dark);
}

#app {
  width: 100%;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box {
  width: 620px;
  max-width: 100%;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 15px 45px rgba(0,0,0,.12);
  text-align: center;
}

.search-box h2 {
  margin: 0 0 8px;
  color: var(--red);
  font-size: 28px;
}

.search-box p {
  color: #555;
}

.search-box input {
  width: 100%;
  margin: 15px 0;
  padding: 14px;
  border: 1px solid #cccccc;
  border-radius: 10px;
  font-size: 15px;
}

button {
  border: none;
  padding: 13px 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  color: white;
  background: linear-gradient(
    90deg,
    var(--red),
    var(--orange)
  );
}


/* =========================================================
   WRAPPER
========================================================= */

.cards-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
}

.side-title {
  margin-bottom: 7px;
  text-align: center;
  color: var(--red);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.5px;
}


/* =========================================================
   CARD
========================================================= */

.id-card {
  position: relative;
  width: 950px;
  max-width: 100%;
  min-height: 590px;
  overflow: hidden;
  border-radius: 30px;
  background: white;
  border: 2px solid var(--red);
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
}

.id-card::before {
  content: "";
  position: absolute;
  width: 360px;
  height: 115px;
  right: -80px;
  top: -55px;
  background: linear-gradient(
    90deg,
    var(--red),
    var(--orange)
  );
  transform: rotate(8deg);
  border-radius: 50%;
}

.id-card::after {
  content: "";
  position: absolute;
  width: 420px;
  height: 100px;
  left: -120px;
  bottom: -55px;
  background: linear-gradient(
    90deg,
    var(--red),
    var(--orange),
    var(--gold)
  );
  transform: rotate(5deg);
  border-radius: 50%;
}


/* =========================================================
   FRONT
========================================================= */

.front-content {
  position: relative;
  z-index: 2;
  padding: 28px 32px 30px;
}

.id-header {
  display: grid;
  grid-template-columns: 110px 1fr 110px;
  align-items: center;
  gap: 15px;
  padding-bottom: 18px;
  border-bottom: 2px solid #f2b24c;
}

.logo {
  width: 92px;
  height: 92px;
  object-fit: contain;
  display: block;
  margin: auto;
}

.header-center {
  text-align: center;
}

.republic {
  font-size: 12px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: #333333;
}

.header-title {
  margin-top: 5px;
  color: var(--red);
  font-size: 30px;
  line-height: 1;
  font-weight: 900;
}

.header-location {
  margin-top: 7px;
  font-size: 14px;
  color: #222222;
}

.digital-label {
  display: inline-block;
  margin-top: 9px;
  padding: 6px 20px;
  border-radius: 999px;
  background: var(--red);
  color: white;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}


/* =========================================================
   FRONT BODY
========================================================= */

.id-body {
  display: grid;
  grid-template-columns: 160px 1fr 190px;
  gap: 28px;
  align-items: center;
  margin-top: 28px;
}

.photo-box {
  width: 150px;
  height: 185px;
  overflow: hidden;
  border: 3px solid var(--red);
  border-radius: 18px;
  background: #f5f5f5;
}

.profile-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--red);
  font-size: 12px;
  font-weight: bold;
}

.label {
  color: #666666;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.member-name {
  margin-top: 5px;
  color: #111111;
  font-size: 34px;
  font-weight: 900;
  line-height: 1.05;
}

.kk-number {
  margin-top: 8px;
  margin-bottom: 20px;
  color: var(--red);
  font-size: 20px;
  font-weight: 900;
}


/* =========================================================
   COMPLETE ADDRESS
========================================================= */

.address-box {
  margin-top: 12px;
  padding: 15px;
  background: #fff7ed;
  border-left: 5px solid var(--orange);
  border-radius: 10px;
}

.address-value {
  margin-top: 5px;
  color: #111111;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
}


/* =========================================================
   FRONT QR
========================================================= */

.qr-area {
  text-align: center;
}

.qr-box {
  display: inline-block;
  padding: 12px;
  background: white;
  border: 3px solid var(--red);
  border-radius: 18px;
}

.qr-box img,
.qr-box canvas {
  width: 150px !important;
  height: 150px !important;
  display: block;
}

.qr-label {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--red);
  color: white;
  font-size: 10px;
}


/* =========================================================
   STATUS
========================================================= */

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid #dddddd;
}

.active-status {
  color: var(--green);
  font-size: 15px;
  font-weight: 900;
}

.status-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--green);
}


/* =========================================================
   FRONT LOWER
========================================================= */

.bottom-section {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 28px;
}

.issued {
  color: #666666;
  font-size: 10px;
  letter-spacing: 1px;
}

.issued-date {
  margin-top: 5px;
  color: #111111;
  font-size: 14px;
  font-weight: bold;
}

.signature-section {
  width: 290px;
  text-align: center;
}

.signed {
  display: inline-block;
  margin-bottom: 24px;
  padding: 5px 10px;
  border-radius: 999px;
  background: #fff5e8;
  color: var(--red);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.2px;
}

.signature-line {
  border-top: 2px solid var(--orange);
  margin-bottom: 8px;
}

.chairperson-name {
  color: var(--red);
  font-size: 17px;
  font-weight: 900;
}

.chairperson-position {
  margin-top: 3px;
  color: #111111;
  font-size: 11px;
  font-weight: bold;
}


/* =========================================================
   BACK
========================================================= */

.back-content {
  position: relative;
  z-index: 2;
  min-height: 590px;
  padding: 35px;
}

.back-header {
  padding: 18px;
  border-radius: 18px;
  background: linear-gradient(
    90deg,
    var(--red),
    var(--orange)
  );
  color: white;
  text-align: center;
}

.back-header h2 {
  margin: 0;
  font-size: 27px;
}

.back-header p {
  margin: 6px 0 0;
  font-size: 12px;
}


/* =========================================================
   PERSONAL INFORMATION
========================================================= */

.personal-title,
.emergency-title {
  margin-top: 25px;
  color: var(--red);
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 1px;
}

.personal-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 13px;
}

.personal-item {
  padding: 17px;
  border: 1px solid #e3e3e3;
  border-top: 4px solid var(--orange);
  border-radius: 12px;
  background: #fffaf5;
}

.personal-value {
  margin-top: 5px;
  color: #111111;
  font-size: 17px;
  font-weight: 900;
}


/* =========================================================
   EMERGENCY
========================================================= */

.emergency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 13px;
}

.emergency-item {
  padding: 17px;
  border: 1px solid #e3e3e3;
  border-left: 5px solid var(--red);
  border-radius: 12px;
  background: white;
}

.emergency-value {
  margin-top: 5px;
  color: #111111;
  font-size: 16px;
  font-weight: 900;
}


/* =========================================================
   BACK LOWER
========================================================= */

.back-lower {
  display: grid;
  grid-template-columns: 1fr 145px;
  gap: 25px;
  align-items: center;
  margin-top: 25px;
}

.id-note {
  padding: 13px 16px;
  background: #fff5e8;
  border-left: 5px solid var(--orange);
  border-radius: 10px;
  color: #444444;
  font-size: 10px;
  line-height: 1.5;
}

.id-note strong {
  color: var(--red);
}

.return-box {
  margin-top: 15px;
  color: #444444;
  font-size: 11px;
  line-height: 1.6;
}

.return-box strong {
  color: var(--red);
}

.back-qr {
  text-align: center;
}

.back-qr-box {
  display: inline-block;
  padding: 9px;
  background: white;
  border: 2px solid var(--orange);
  border-radius: 12px;
}

.back-qr-box img,
.back-qr-box canvas {
  width: 105px !important;
  height: 105px !important;
  display: block;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
  margin-top: 25px;
  text-align: center;
}



/* =========================================================
   ID VIEW CONTROLS
========================================================= */

.id-side {
  width: 950px;
  max-width: 100%;
}

.view-controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

.view-controls button {
  min-width: 150px;
}

.secondary-btn {
  background: #333333;
}

@media screen {
  .id-side.hidden-side {
    display: none;
  }
}

.back-member-strip {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
  margin-top: 18px;
  padding: 14px 16px;
  border: 1px solid #ead9cc;
  border-radius: 12px;
  background: #fffaf5;
}

.back-member-name {
  margin-top: 4px;
  font-size: 20px;
  font-weight: 900;
  color: #111111;
}

.back-member-id {
  color: var(--red);
  font-size: 16px;
  font-weight: 900;
  white-space: nowrap;
}

.back-extra-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 13px;
}

.back-extra-item {
  padding: 14px;
  border: 1px solid #e3e3e3;
  border-top: 4px solid var(--orange);
  border-radius: 12px;
  background: #fffaf5;
}

.back-extra-value {
  margin-top: 5px;
  color: #111111;
  font-size: 14px;
  font-weight: 900;
  word-break: break-word;
}

.verification-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.verification-item {
  padding: 12px 14px;
  border-radius: 10px;
  background: #f8f8f8;
  border-left: 4px solid var(--red);
}

.verification-value {
  margin-top: 4px;
  font-size: 13px;
  font-weight: 900;
  color: #111111;
}

@media(max-width: 760px) {
  .back-member-strip,
  .back-extra-grid,
  .verification-strip {
    grid-template-columns: 1fr;
  }

  .back-member-id {
    white-space: normal;
  }
}


/* =========================================================
   ERROR
========================================================= */

.error {
  width: 520px;
  max-width: 100%;
  margin: 50px auto;
  padding: 30px;
  background: white;
  border: 2px solid var(--red);
  border-radius: 20px;
  text-align: center;
  color: #111111;
}



/* =========================================================
   COMPACT BACK - ESSENTIAL INFORMATION ONLY
========================================================= */

.compact-back-grid {
  grid-template-columns: 1fr 1fr 1.2fr;
}

.compact-back-grid .address-wide {
  grid-column: 1 / -1;
}

.status-row {
  justify-content: flex-start;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 760px) {

  body {
    padding: 12px;
  }

  .id-header {
    grid-template-columns: 65px 1fr 65px;
  }

  .logo {
    width: 58px;
    height: 58px;
  }

  .header-title {
    font-size: 19px;
  }

  .id-body {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .photo-box {
    margin: auto;
  }

  .bottom-section {
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .personal-grid,
  .emergency-grid {
    grid-template-columns: 1fr;
  }

  .back-lower {
    grid-template-columns: 1fr;
    text-align: center;
  }
}




/* =========================================================
   FINAL SCREEN LAYOUT - MATCH REQUESTED FRONT / BACK
   PRINT PRESET BELOW IS UNCHANGED
========================================================= */

<script>

/* =========================================================
   GET ID FROM URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const kkID =
  params.get("id");

if (kkID) {
  loadID(kkID);
}


/* =========================================================
   OPEN ID
========================================================= */

function openID() {

  const id =
    document
      .getElementById("kkInput")
      .value
      .trim();

  if (!id) {
    alert("Please enter your KK ID.");
    return;
  }

  window.location.href =
    "digital-id.html?id=" +
    encodeURIComponent(id);
}


/* =========================================================
   LOAD ID
========================================================= */

async function loadID(id) {

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="search-box">
      <h2>Loading Digital KK ID...</h2>
      <p>Please wait while we retrieve your record.</p>
    </div>
  `;

  try {

    if (
      typeof KK_CONFIG === "undefined" ||
      !KK_CONFIG.API_URL
    ) {
      throw new Error(
        "KK API URL is missing. Check config.js."
      );
    }

    const apiURL =
      String(KK_CONFIG.API_URL).trim();

    const url =
      apiURL +
      "?action=digital&id=" +
      encodeURIComponent(id) +
      "&t=" +
      Date.now();

    console.log("KK ID:", id);
    console.log("KK API:", url);

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      redirect: "follow"
    });

    if (!response.ok) {
      throw new Error(
        "KK server returned HTTP " +
        response.status + "."
      );
    }

    const responseText =
      await response.text();

    if (!responseText.trim()) {
      throw new Error(
        "KK server returned an empty response."
      );
    }

    let result;

    try {
      result = JSON.parse(responseText);
    } catch (jsonError) {
      console.error(
        "Invalid KK API response:",
        responseText
      );

      throw new Error(
        "KK server did not return valid JSON. Check the Apps Script deployment."
      );
    }

    if (
      !result.success ||
      !result.data
    ) {
      showError(
        result.message ||
        "Digital ID not found."
      );
      return;
    }

    const person = result.data;

    const verificationStatus =
      String(
        person.VERIFICATION_STATUS || ""
      )
      .trim()
      .toUpperCase();

    const idStatus =
      String(
        person.ID_STATUS || ""
      )
      .trim()
      .toUpperCase();

    if (verificationStatus !== "VERIFIED") {
      showError(
        "This registration has not yet been verified."
      );
      return;
    }

    if (idStatus !== "ACTIVE") {
      showError(
        "This Digital KK ID is not active."
      );
      return;
    }

    displayID(person);

  } catch (error) {

    console.error(
      "DIGITAL KK ID ERROR:",
      error
    );

    showError(
      error.message ||
      "Unable to connect to the KK server."
    );
  }
}


/* =========================================================
   PHILIPPINE DATE / TIME FORMAT
========================================================= */

function formatPhilippineDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return String(value);
  }

  return new Intl.DateTimeFormat(
    "en-PH",
    {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }
  ).format(date);
}



function formatPhilippineDateOnly(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return new Intl.DateTimeFormat(
    "en-PH",
    {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);
}


function getExpirationDate(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "—";
  date.setFullYear(date.getFullYear() + 1);
  return formatPhilippineDateOnly(date);
}

function getDisplaySex(value) {
  const sex = String(value || "").trim().toUpperCase();
  if (sex === "MALE" || sex === "M") return "Male";
  if (sex === "FEMALE" || sex === "F") return "Female";
  return "—";
}

/* =========================================================
   GOOGLE FORM / DRIVE PROFILE PHOTO
========================================================= */

function getProfilePhotoURL(value) {

  if (!value) {
    return "";
  }

  const raw =
    String(value)
      .split(",")[0]
      .trim();

  if (!raw) {
    return "";
  }

  const driveMatch =
    raw.match(
      /\/d\/([a-zA-Z0-9_-]+)/
    );

  const idMatch =
    raw.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );

  const fileID =
    driveMatch
      ? driveMatch[1]
      : (
          idMatch
            ? idMatch[1]
            : ""
        );

  if (fileID) {

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(fileID) +
      "&sz=w1000"
    );

  }

  return raw;
}

  /* =======================================================

    getProfilePhotoURL(
      person.HOLDER_SIGNATURE_URL ||
      person.holder_signature_url ||
      ""
    );

  if (holderSignature) {

    if (holderSignatureURL) {

      holderSignature.src =
        holderSignatureURL;

      holderSignature.style.display =
        "block";

      holderSignature.onerror =
        function () {
          this.removeAttribute("src");
          this.style.display = "none";
          console.warn(
            "Unable to load KK holder signature.",
            holderSignatureURL
          );
        };

    } else {

      holderSignature.removeAttribute("src");
      holderSignature.style.display =
        "none";

  /* =======================================================

        ) +

      encodeURIComponent(

  if (
    typeof QRCode !==
    "undefined"
  ) {

      document.getElementById(
        "qrcodeFront"
      ),

        text: qrValue,
        width: 150,
        height: 150,
        correctLevel:
          QRCode.CorrectLevel.H
      }
    );


    new QRCode(
      document.getElementById(
        "qrcodeBack"
      ),
      {
        text: qrValue,
        width: 105,
        height: 105,
        correctLevel:
          QRCode.CorrectLevel.H
      }
    );

/* =========================================================
   FRONT / BACK VIEW
========================================================= */

function showIDSide(side) {

  const front =
    document.getElementById("frontSide");

  const back =
    document.getElementById("backSide");

  if (!front || !back) {
    return;
  }

  if (side === "front") {
    front.classList.remove("hidden-side");
    back.classList.add("hidden-side");
    front.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  if (side === "back") {
    front.classList.add("hidden-side");
    back.classList.remove("hidden-side");
    back.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  front.classList.remove("hidden-side");
  back.classList.remove("hidden-side");
}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  document
    .getElementById("app")
    .innerHTML = `

      <div class="error">

        <h2>
          Digital ID Unavailable
        </h2>

        <p>
          ${escapeHTML(message)}
        </p>

      </div>

    `;
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );
}
