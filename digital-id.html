<body>

<div id="app">

  <div class="search-box">

    <h2>
      ACCESS DIGITAL KK ID
    </h2>

    <p>
      Enter your verified KK ID.
    </p>

    <input
      id="kkInput"
      placeholder="KK-SAP-2026-58310472"
    >

    <button onclick="openID()">
      ACCESS DIGITAL ID
    </button>

  </div>

</div>

<script src="config.js"></script>

<script>

/* =========================================================
   GET ID FROM URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const kkID =
  params.get("id");

if (kkID) {
  loadID(kkID);
}


/* =========================================================
   OPEN ID
========================================================= */

function openID() {

  const id =
    document
      .getElementById("kkInput")
      .value
      .trim();

  if (!id) {
    alert("Please enter your KK ID.");
    return;
  }

  window.location.href =
    "digital-id.html?id=" +
    encodeURIComponent(id);
}


/* =========================================================
   LOAD ID
========================================================= */

async function loadID(id) {

  const app =
    document.getElementById("app");

  app.innerHTML = `
    <div class="search-box">
      Loading Digital KK ID...
    </div>
  `;

  try {

    const url =
      KK_CONFIG.API_URL +
      "?action=digital&id=" +
      encodeURIComponent(id) +
      "&t=" +
      Date.now();

    const response =
      await fetch(url);

    const result =
      await response.json();

    if (
      !result.success ||
      !result.data
    ) {

      showError(
        result.message ||
        "Digital ID not found."
      );

      return;
    }

    const person =
      result.data;

    if (
      String(person.VERIFICATION_STATUS || "")
        .trim()
        .toUpperCase() !==
      "VERIFIED"
    ) {

      showError(
        "This registration has not yet been verified."
      );

      return;
    }

    if (
      String(person.ID_STATUS || "")
        .trim()
        .toUpperCase() !==
      "ACTIVE"
    ) {

      showError(
        "This Digital KK ID is not active."
      );

      return;
    }

    displayID(person);

  }

  catch(error) {

    console.error(error);

    showError(
      "Unable to connect to the KK server."
    );
  }
}


/* =========================================================
   PHILIPPINE DATE / TIME FORMAT
========================================================= */

function formatPhilippineDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return String(value);
  }

  return new Intl.DateTimeFormat(
    "en-PH",
    {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }
  ).format(date);
}



function formatPhilippineDateOnly(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return new Intl.DateTimeFormat(
    "en-PH",
    {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);
}

/* =========================================================
   GOOGLE FORM / DRIVE PROFILE PHOTO
========================================================= */

function getProfilePhotoURL(value) {

  if (!value) {
    return "";
  }

  const raw =
    String(value)
      .split(",")[0]
      .trim();

  if (!raw) {
    return "";
  }

  const driveMatch =
    raw.match(
      /\/d\/([a-zA-Z0-9_-]+)/
    );

  const idMatch =
    raw.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );

  const fileID =
    driveMatch
      ? driveMatch[1]
      : (
          idMatch
            ? idMatch[1]
            : ""
        );

  if (fileID) {

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(fileID) +
      "&sz=w1000"
    );

  }

  return raw;
}


/* =========================================================
   DISPLAY FRONT + BACK
========================================================= */

function displayID(person) {

  let photoHTML;

  const profilePhotoURL =
    getProfilePhotoURL(
      person.PROFILE_PHOTO_URL
    );

  if (
    profilePhotoURL
  ) {

    photoHTML = `

      <img
        src="${escapeHTML(
          profilePhotoURL
        )}"
        class="profile-photo"
        alt="Profile Picture"
        onerror="
          this.style.display='none';
          document.getElementById('photoFallback').style.display='flex';
        "
      >

      <div
        id="photoFallback"
        class="photo-placeholder"
        style="display:none;"
      >
        PROFILE<br>
        PICTURE
      </div>

    `;

  } else {

    photoHTML = `

      <div class="photo-placeholder">
        PROFILE<br>
        PICTURE
      </div>

    `;
  }


  const app =
    document.getElementById("app");


  app.innerHTML = `

  <div class="cards-wrapper">


    <!-- =====================================================
         FRONT
    ====================================================== -->

    <div id="frontSide" class="id-side">

      <div class="side-title">
        FRONT
      </div>

      <div class="id-card">

        <div class="front-content">


          <div class="id-header">

            <img
              src="images/ChatGPT Image Aug 24, 2026, 06_57_13 PM.png"
              class="logo"
              alt="Sangguniang Kabataan Logo"
            >


            <div class="header-center">

              <div class="republic">
                Republic of the Philippines
              </div>

              <div class="header-title">
                KATIPUNAN NG KABATAAN
              </div>

              <div class="header-location">
                Barangay Sapilang, Bacnotan, La Union
              </div>

              <div class="digital-label">
                DIGITAL KK ID
              </div>

            </div>


            <img
              src="images/Bagong_Pilipinas_logo.png"
              class="logo"
              alt="Bagong Pilipinas Logo"
            >

          </div>


          <div class="id-body">


            <div class="photo-box">
              ${photoHTML}
            </div>


            <div>

              <div class="label">
                REGISTERED MEMBER
              </div>

              <div class="member-name">
                ${escapeHTML(
                  person.FULL_NAME || "—"
                )}
              </div>

              <div class="kk-number">
                ${escapeHTML(
                  person.KK_ID || "—"
                )}
              </div>


              <div class="address-box">

/* =========================================================
   FRONT / BACK VIEW
========================================================= */

function showIDSide(side) {

  const front =
    document.getElementById("frontSide");

  const back =
    document.getElementById("backSide");

  if (!front || !back) {
    return;
  }

  if (side === "front") {
    front.classList.remove("hidden-side");
    back.classList.add("hidden-side");
    front.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  if (side === "back") {
    front.classList.add("hidden-side");
    back.classList.remove("hidden-side");
    back.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  front.classList.remove("hidden-side");
  back.classList.remove("hidden-side");
}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  document
    .getElementById("app")
    .innerHTML = `

      <div class="error">

        <h2>
          Digital ID Unavailable
        </h2>

        <p>
          ${escapeHTML(message)}
        </p>

      </div>

    `;
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );
}
