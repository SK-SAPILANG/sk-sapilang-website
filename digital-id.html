<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital KK ID</title><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>.id{max-width:800px;margin:25px auto;background:linear-gradient(135deg,#0b2035,#14507b);border:1px solid #4baee3;border-radius:24px;padding:30px}.idbody{display:grid;grid-template-columns:1fr 180px;gap:25px;align-items:center;margin-top:35px}.name{font-size:32px;font-weight:900}.kk{font-size:20px;color:#86dcff;margin:10px 0 25px}.qr{background:#fff;padding:12px;border-radius:15px;width:max-content}.controls{text-align:center;margin:20px}@media(max-width:650px){.idbody{grid-template-columns:1fr}.qr{margin:auto}}@media print{.controls{display:none}body{background:#fff}}</style></head><body><div class="container"><div id="app" class="panel card"><div class="row"><input id="idInput" placeholder="KK-SAP-2026-0001"><button class="primary" onclick="go()">Access Digital ID</button></div><div class="muted center">Enter your verified KK ID.</div></div></div><script src="config.js"></script><script>
const q=new URLSearchParams(location.search).get("id");if(q)load(q);function go(){let id=document.getElementById("idInput").value.trim();if(id)location.search="?id="+encodeURIComponent(id)}
async function load(id){let app=document.getElementById("app");app.innerHTML="Loading Digital KK ID...";try{let r=await fetch(KK_CONFIG.API_URL+"?action=digital&id="+encodeURIComponent(id)+"&t="+Date.now());let j=await r.json();if(!j.success||!j.data||j.data.ID_STATUS!=="ACTIVE"){app.innerHTML=`<div class="message error">${esc(j.message||"This Digital KK ID is not active.")}</div>`;return}let p=j.data;app.innerHTML=`<div class="id"><small>REPUBLIC OF THE PHILIPPINES</small><h2>Katipunan ng Kabataan Digital ID</h2><div>Barangay Sapilang • Bacnotan, La Union</div><div class="idbody"><div><div class="muted">REGISTERED MEMBER</div><div class="name">${esc(p.FULL_NAME)}</div><div class="kk">${esc(p.KK_ID)}</div><p><b>Barangay:</b> ${esc(p.BARANGAY)}</p><p><b>Municipality:</b> ${esc(p.MUNICIPALITY)}</p><p><b>Youth Age Group:</b> ${esc(p.YOUTH_AGE_GROUP)}</p><p><b>Status:</b> VERIFIED • ACTIVE</p><p><b>Date Verified:</b> ${esc(p.DATE_VERIFIED||"—")}</p></div><div><div id="qrcode" class="qr"></div><p class="center muted">Scan to verify</p></div></div></div><div class="controls"><button class="primary" onclick="window.print()">Print / Save as PDF</button></div>`;if(p.QR_CODE)new QRCode(document.getElementById("qrcode"),{text:p.QR_CODE,width:150,height:150})}catch(e){app.innerHTML='<div class="message error">Unable to connect to the KK server.</div>'}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
