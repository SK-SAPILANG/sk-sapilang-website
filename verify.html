<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KK ID Verification</title><link rel="stylesheet" href="styles.css"></head><body><div class="container"><div class="center"><h1>KK ID Verification</h1><p class="muted">Barangay Sapilang • Bacnotan, La Union</p></div><div class="panel card"><div class="row"><input id="idInput" placeholder="KK-SAP-2026-0001"><button class="primary" onclick="go()">Verify ID</button></div><div id="result" class="center muted">Enter a KK ID to verify.</div></div></div><script src="config.js"></script><script>
const q=new URLSearchParams(location.search).get("id");if(q){document.getElementById("idInput").value=q;verify(q)}
function go(){const id=document.getElementById("idInput").value.trim();if(id)location.search="?id="+encodeURIComponent(id)}
async function verify(id){let box=document.getElementById("result");box.innerHTML="Checking ID...";try{let r=await fetch(KK_CONFIG.API_URL+"?action=verify&id="+encodeURIComponent(id)+"&t="+Date.now());let j=await r.json();if(!j.success||!j.data){box.innerHTML=`<div class="message error">${esc(j.message||"ID not found.")}</div>`;return}let p=j.data;box.innerHTML=`<h2>${j.valid?"✓ VERIFIED KK MEMBER":"ID NOT ACTIVE"}</h2><div class="details">${d("KK ID",p.KK_ID)}${d("Name",p.FULL_NAME)}${d("Barangay",p.BARANGAY)}${d("Municipality",p.MUNICIPALITY)}${d("Youth Age Group",p.YOUTH_AGE_GROUP)}${d("Verification",p.VERIFICATION_STATUS)}${d("ID Status",p.ID_STATUS)}${d("Date Verified",p.DATE_VERIFIED)}</div>`}catch(e){box.innerHTML='<div class="message error">Unable to connect to the verification server.</div>'}}
function d(a,b){return `<div class="detail"><span class="muted">${esc(a)}</span><strong>${esc(b||"—")}</strong></div>`}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
