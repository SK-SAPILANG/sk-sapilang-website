  <style>
    html, body { width:100%; height:100%; margin:0; background:#020b13; overflow:hidden; }
    #skSiteFrame { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#020b13; }
    #skFrameLoading { position:fixed; inset:0; z-index:999990; display:grid; place-items:center; pointer-events:none; background:#020b13; color:#43d7ff; font:800 11px/1.4 Arial,sans-serif; letter-spacing:.16em; opacity:1; transition:opacity .22s ease; }
    #skFrameLoading.hidden { opacity:0; }
  </style>

<body>
  <div id="skFrameLoading">SK SAPILANG</div>
  <iframe id="skSiteFrame" title="SK Sapilang Website" src="home.html?v=20260830-02"></iframe>

  <script src="js/music-player.js?v=20260830-02"></script>
  <script>
    (function () {
      "use strict";
      const frame = document.getElementById("skSiteFrame");
      const loading = document.getElementById("skFrameLoading");
      const allowed = new Set([
        "home.html","about.html","admin.html","announcements.html","awards.html",
        "contact.html","digital-id.html","events.html","feedback.html","kk-portal.html",
        "organization.html","programs.html","resolutions.html","transparency.html","verify.html"
      ]);

      function safePage(value) {
        if (!value) return "home.html";
        let decoded;
        try { decoded = decodeURIComponent(value); } catch (e) { return "home.html"; }
        const base = decoded.split("?")[0].split("#")[0];
        if (!allowed.has(base)) return "home.html";
        return decoded;
      }

      function freshPage(page) {
    const hashIndex = page.indexOf("#");
    let hash = "";

    if (hashIndex >= 0) {
        hash = page.slice(hashIndex);
        page = page.slice(0, hashIndex);
    }

    const separator = page.includes("?") ? "&" : "?";

    return page + separator + "v=20260830-02" + hash;
}

const params = new URLSearchParams(location.search);
      const initial = safePage(params.get("page"));
      frame.src = freshPage(initial);

      frame.addEventListener("load", function () {
        loading.classList.add("hidden");
      });

      window.addEventListener("message", function (event) {
        if (event.origin !== location.origin) return;
        if (!event.data || event.data.type !== "sk-page-change") return;
        const page = safePage(event.data.page);
        const current = safePage(new URLSearchParams(location.search).get("page"));
        if (page === current) return;
        const url = new URL(location.href);
        if (page === "home.html") url.searchParams.delete("page");
        else url.searchParams.set("page", page);
        history.pushState({ page: page }, "", url.pathname + url.search);
      });

      window.addEventListener("popstate", function () {
        const page = safePage(new URLSearchParams(location.search).get("page"));
        try {
          const inside = frame.contentWindow.location.pathname.split("/").pop() + frame.contentWindow.location.search + frame.contentWindow.location.hash;
          if (inside === page) return;
        } catch (e) {}
        loading.classList.remove("hidden");
        frame.src = freshPage(page);
      });
    })();
  </script>
</body>
